plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.14'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
}

loom {
    accessWidenerPath = file('src/main/resources/mms_worldgen.accesswidener')
    runs {
        configureEach {
            // OpenJ9 dev runs without system core dumps
            if (System.getProperty("java.vm.name").contains("OpenJ9")) {
                vmArg "-Xdump:system:none"
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

processResources {
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Native targets as Rust triple, jar folder, library file, cross-linker use and glibc floor
def nativeTargets = [
    [triple: 'aarch64-apple-darwin', folder: 'macos-aarch64', file: 'libmms_worldgen_native.dylib', zig: false],
    [triple: 'x86_64-apple-darwin', folder: 'macos-x86_64', file: 'libmms_worldgen_native.dylib', zig: false],
    [triple: 'x86_64-unknown-linux-gnu', folder: 'linux-x86_64', file: 'libmms_worldgen_native.so', zig: true, glibc: '2.17'],
    [triple: 'aarch64-unknown-linux-gnu', folder: 'linux-aarch64', file: 'libmms_worldgen_native.so', zig: true, glibc: '2.17'],
    [triple: 'x86_64-pc-windows-gnu', folder: 'windows-x86_64', file: 'mms_worldgen_native.dll', zig: true]
]

def nativeDir = file("$projectDir/native")
def requireNatives = providers.gradleProperty('natives.require').map { it.toBoolean() }.orElse(false)
def rustSysroot = providers.exec { commandLine 'rustc', '--print', 'sysroot' }
    .standardOutput.asText.map { it.trim() }
def zigbuildReady = providers.exec {
    commandLine 'cargo', 'zigbuild', '--help'
    ignoreExitValue = true
}.result.map { it.exitValue == 0 }

def missingToolchain = { target ->
    def missing = []
    if (!file("${rustSysroot.get()}/lib/rustlib/${target.triple}").isDirectory()) {
        missing << "Rust std (rustup target add ${target.triple})"
    }
    if (target.zig && !zigbuildReady.get()) {
        missing << 'cargo-zigbuild'
    }
    missing
}

// Fails a release build that would ship without every native target
def verifyNatives = tasks.register('verifyNatives') {
    onlyIf { requireNatives.get() }
    doLast {
        def problems = nativeTargets.findAll { !missingToolchain(it).isEmpty() }.collect {
            "${it.triple} needs ${missingToolchain(it).join(' and ')}"
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Release blocked, missing native toolchains:\n  " + problems.join('\n  '))
        }
    }
}

def cargoTasks = nativeTargets.collect { target ->
    def name = target.folder.split('-').collect { it.capitalize() }.join('')
    tasks.register("cargoBuild${name}", Exec) {
        dependsOn verifyNatives
        workingDir nativeDir
        commandLine 'cargo', target.zig ? 'zigbuild' : 'build', '--release', '--target', target.triple + (target.glibc ? ".${target.glibc}" : '')
        inputs.dir("$nativeDir/src")
        inputs.file("$nativeDir/Cargo.toml")
        outputs.file("$nativeDir/target/${target.triple}/release/${target.file}")
        onlyIf("toolchain for ${target.triple} is installed") {
            def missing = missingToolchain(target)
            if (!missing.isEmpty()) {
                logger.warn("Skipping native ${target.triple}: needs ${missing.join(' and ')}, jar ships without it")
            }
            missing.isEmpty()
        }
    }
}

def packNatives = tasks.register('packNatives', Copy) {
    dependsOn cargoTasks
    into layout.buildDirectory.dir('natives')
    nativeTargets.each { target ->
        from("$nativeDir/target/${target.triple}/release/${target.file}") {
            into "natives/${target.folder}"
        }
    }
}

processResources {
    from(packNatives)
}

// Fails the build when a plain class sits in a mixin package
def checkMixinPackages = tasks.register('checkMixinPackages', Exec) {
    dependsOn tasks.named('remapJar')
    doFirst {
        commandLine 'python3',
                "$projectDir/gradle/scripts/check-mixin-packages.py",
                tasks.named('remapJar').get().archiveFile.get().asFile
    }
}

tasks.named('build') { dependsOn checkMixinPackages }
